name: Jules Autopilot (CI Doctor & Scheduled Audit)

on:
  workflow_run:
    workflows:
      - "Verify repository gatekeeper"
      - "Verify agents management, runtime, and CLI"
      - "Verify web and desktop"
      - "Verify mobile app"
      - "Verify TypeScript runtime"
    types: [completed]
    branches: [main]
  schedule:
    # Runs daily at 02:00 UTC (10:00 CST)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: jules-autopilot-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ci-failure-doctor:
    name: Dispatch Jules on CI failure
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.JULES_PAT || github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract failure logs and create surgical Jules issue
        shell: bash
        run: |
          set -euo pipefail

          TITLE="fix(ci): repair failing workflow '${WORKFLOW_NAME}' (${HEAD_SHA:0:7})"
          EXISTING=$(gh issue list --repo "$REPO" --label "jules" --state open --search "repair failing workflow '${WORKFLOW_NAME}'" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open Jules issue already exists for '${WORKFLOW_NAME}'. Skipping duplicate creation."
            exit 0
          fi

          LOG_SNIPPET=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | grep -E "not ok|error:|Error:|FAILED|ERR_MODULE_NOT_FOUND|AssertionError|timed out|##\[error\]" -C 6 | tail -n 120 || true)
          if [ -z "$LOG_SNIPPET" ]; then
            LOG_SNIPPET=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -n 100 || true)
          fi
          if [ -z "$LOG_SNIPPET" ]; then
            JOB_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .id' | head -n 1)
            if [ -n "$JOB_ID" ]; then
              LOG_SNIPPET=$(gh run view --job="$JOB_ID" --repo "$REPO" --log 2>/dev/null | grep -E "not ok|error:|Error:|FAILED|ERR_MODULE_NOT_FOUND|AssertionError|timed out" -C 4 | tail -n 120 || true)
            fi
          fi
          LOG_SNIPPET=$(printf '%s' "$LOG_SNIPPET" | tail -c 20000)

          COMMIT_INFO=$(git log -1 --stat "$HEAD_SHA" 2>/dev/null | head -n 60 | head -c 8000 || true)

          BODY=$(cat <<EOF
          ## Objective

          The CI workflow **${WORKFLOW_NAME}** ended with status \`${CONCLUSION}\` on \`main\` at commit \`${HEAD_SHA}\`.
          Diagnose and fix the root cause with minimal, surgical changes following \`AGENTS.md\`.

          - **Workflow Run**: ${RUN_URL}
          - **Commit**: \`${HEAD_SHA}\`

          ---

          ## Environment Setup

          \`\`\`bash
          npm --prefix runtime ci && npm --prefix runtime run build
          npm --prefix agent-management ci && npm --prefix agent-management run build
          npm --prefix frontend-cli ci
          \`\`\`

          ---

          ## Recent Commit Context

          \`\`\`text
          ${COMMIT_INFO}
          \`\`\`

          ## Extracted Failure Log

          \`\`\`text
          ${LOG_SNIPPET:-No failed step log captured; inspect the workflow run and reproduce locally.}
          \`\`\`

          ---

          ## Constraints & Verification

          1. Follow \`AGENTS.md\`: prefer the simplest implementation, avoid speculative abstractions, and only modify files directly required to fix the failure.
          2. Run the corresponding deterministic regression suite (\`npm --prefix runtime test\`, \`npm --prefix agent-management test\`, \`npm --prefix frontend-cli test\`) and verify \`0\` failures before opening the PR.
          EOF
          )

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s' "${BODY:0:60000}" > "$BODY_FILE"

          gh issue create \
            --repo "$REPO" \
            --label "jules" \
            --label "bug" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"

  scheduled-audit:
    name: Gatekeeper audit & conditional Jules dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.JULES_PAT || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Build TypeScript runtime for gatekeeper tests
        run: |
          npm --prefix runtime ci
          npm --prefix runtime run build
      - name: Run deterministic gatekeeper checks
        shell: bash
        run: |
          node --input-type=module - <<'EOF'
          import { spawnSync } from "node:child_process";

          const repo = process.env.REPO;
          const archRun = spawnSync("node", ["--test", "runtime/test/architecture.test.js"], { encoding: "utf8" });
          if (archRun.status === 0) {
            console.log("All gatekeeper checks passed with 0 issues. Exiting cleanly without waking Jules.");
            process.exit(0);
          }

          const output = `${archRun.stdout || ""}\n${archRun.stderr || ""}`.trim().slice(-4000);
          const existingProc = spawnSync(
            "gh",
            ["issue", "list", "--repo", repo, "--label", "jules", "--state", "open", "--json", "title"],
            { encoding: "utf8" }
          );
          if (existingProc.status !== 0) {
            throw new Error(`gh issue list failed: ${existingProc.stderr}`);
          }
          const openIssues = JSON.parse(existingProc.stdout || "[]");
          if (openIssues.some((item) => String(item.title || "").includes("[Autopilot Audit]"))) {
            console.log("An open [Autopilot Audit] Jules issue already exists. Skipping duplicate creation.");
            process.exit(0);
          }

          const body = [
            "## Objective",
            "The scheduled Gatekeeper Audit detected actionable dependency, type, documentation, or architecture drift on `main`. Fix the failing checks below with minimal, surgical changes.",
            "---",
            "## Environment Setup",
            "```bash\nnpm --prefix runtime ci && npm --prefix runtime run build\n```",
            "---",
            "## Scope & Findings",
            "> **Constraint**: Only modify the files directly implicated by the test failure below. Follow `AGENTS.md`.",
            "### Gatekeeper test failure (`runtime/test/architecture.test.js`)",
            `\`\`\`text\n${output}\n\`\`\``,
            "---",
            "## Verification (Must Pass Before Opening PR)",
            "```bash\nnpm --prefix runtime run build && node --test runtime/test/architecture.test.js\n```",
          ].join("\n\n");

          const title = "fix(ci): [Autopilot Audit] resolve repository gatekeeper drift";
          const created = spawnSync(
            "gh",
            ["issue", "create", "--repo", repo, "--label", "jules", "--title", title, "--body", body],
            { encoding: "utf8" }
          );
          if (created.status !== 0) {
            throw new Error(`gh issue create failed: ${created.stderr}`);
          }
          console.log("Created Jules issue:", created.stdout.trim());
          EOF

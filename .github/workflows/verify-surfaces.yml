name: Verify web and desktop

on:
  pull_request:
    paths:
      - "frontend-web/**"
      - "desktop/**"
      - "agent/**"
      - "main.py"
      - "requirements*.txt"
      - ".github/workflows/verify-surfaces.yml"
  push:
    branches: [main]
    paths:
      - "frontend-web/**"
      - "desktop/**"
      - "agent/**"
      - "main.py"
      - "requirements*.txt"
      - ".github/workflows/verify-surfaces.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surfaces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surfaces:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Worker dependencies for the local protocol smoke test
        run: python -m pip install -r requirements-runtime.txt
      - name: Install Web dependencies
        run: npm --prefix frontend-web ci
      - name: Install Desktop dependencies
        run: npm --prefix desktop ci
      - name: Test Web
        run: npm --prefix frontend-web test
      - name: Typecheck Desktop
        run: npm --prefix desktop run typecheck
      - name: Test Desktop and Gateway
        run: npm --prefix desktop test
      - name: Build Desktop and bundled Web
        run: npm --prefix desktop run build

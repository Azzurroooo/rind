name: Verify mobile app
on:
  pull_request:
    paths: ["mobile/**", "frontend-web/**", "desktop/src/main/gateway/**", "desktop/package*.json", "agent/runtime/server/websocket.py", "agent/version.py", ".github/workflows/verify-mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "frontend-web/**", "desktop/src/main/gateway/**", "desktop/package*.json", "agent/runtime/server/websocket.py", "agent/version.py", ".github/workflows/verify-mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm --prefix mobile ci
      - run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run sync
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: npm run test:e2e
        working-directory: mobile
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: rind-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile

name: Verify TypeScript runtime

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix runtime install
      - run: npm --prefix runtime run build
      - run: npm --prefix runtime test

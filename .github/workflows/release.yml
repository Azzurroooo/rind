name: Request complete Rind release build

# Tags identify reviewed source; publication follows complete inventory checks.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed source tag or SHA
        required: true
      distribution_ref:
        description: Committed distribution branch or tag
        required: true
        default: main
      android_version_code:
        description: Increasing Android versionCode
        required: true
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Dispatch complete distribution build (does not publish)
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
          DISTRIBUTION_REF: ${{ inputs.distribution_ref }}
          ANDROID_CODE: ${{ inputs.android_version_code }}
        run: |
          test -n "$GH_TOKEN"
          gh workflow run build-release-assets.yml --repo Azzurroooo/rind-distribution \
            --ref "$DISTRIBUTION_REF" -f source_ref="$(git rev-parse HEAD)" \
            -f android_version_code="$ANDROID_CODE"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rind">
  <defs>
    <filter id="coreBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <clipPath id="tile"><rect x="10" y="10" width="100" height="100" rx="22" /></clipPath>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="22" fill="#0b1115" stroke="#5fd7ff" stroke-width="2.5" />
  <g clip-path="url(#tile)">
    <rect x="10" y="10" width="100" height="100" fill="#13242b" />
    <polygon points="75,10 110,10 110,110 10,110 10,75" fill="#f5c451" />
    <polygon points="75,10 110,10 110,110 10,110 10,75" fill="#f5c451" filter="url(#coreBlur)" opacity="0.5" />
    <line x1="75" y1="10" x2="10" y2="75" stroke="#5fd7ff" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>

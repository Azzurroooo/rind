name: Verify TypeScript runtime

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: "20"
          - os: windows-latest
            node: "22"
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "22"
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep (rg) is available on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: Ensure ripgrep (rg) is available on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
      - name: Ensure ripgrep (rg) is available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
            if (Test-Path "C:\ProgramData\chocolatey\bin") {
              "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm --prefix runtime ci
      - run: npm --prefix runtime test

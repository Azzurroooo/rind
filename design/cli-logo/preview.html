<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rind · Terminal mark</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px; background: #151d18; color: var(--paper); font: 14px/1.7 Consolas, monospace; }
    main { max-width: 780px; margin: auto; }
    header { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 20px; }
    a { color: var(--core); text-underline-offset: 4px; }
    .terminal { padding: 32px; border: 1px solid var(--shell); border-radius: 16px; display: flex; gap: 28px; align-items: center; }
    #mark { white-space: pre; font-size: 16px; line-height: 1; flex: none; }
    .note { opacity: .7; }
    @media (max-width: 600px) { .terminal { padding: 24px 16px; flex-direction: column; align-items: flex-start; } #mark { font-size: 14px; } }
  </style>
</head>
<body><main>
  <header><strong>Rind · 终端标记</strong><a href="../rind-logo.html">静态与动效</a></header>
  <section class="terminal"><div id="mark" role="img" aria-label="Rind 终端标记"></div><div><strong>Rind</strong><p class="note">workbench online</p><p>› Ask Rind to do anything</p></div></section>
  <p class="note">同一套几何，两个品牌色。半块字符把两行像素折叠为一行终端输出。</p>
</main>
<script type="module">
  import { HEX, rasterize, halfBlock } from './logo.js';
  for (const [name, color] of Object.entries(HEX)) document.documentElement.style.setProperty(`--${name}`, color);
  const { width, height, grid } = rasterize(24);
  const mark = document.querySelector('#mark');
  for (let row = 0; row < height; row += 2) {
    for (let col = 0; col < width; col += 1) {
      const cell = halfBlock(grid[row * width + col], grid[(row + 1) * width + col]);
      const span = document.createElement('span');
      span.textContent = cell.char;
      span.style.color = HEX[cell.foreground] || 'transparent';
      span.style.background = HEX[cell.background] || 'transparent';
      mark.append(span);
    }
    mark.append('\n');
  }
</script>
</body>
</html>

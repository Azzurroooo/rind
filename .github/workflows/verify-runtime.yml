name: Verify TypeScript runtime

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/verify-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: "20"
          - os: windows-latest
            node: "22"
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "22"
          - os: macos-14
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm --prefix runtime ci
      - run: npm --prefix runtime test

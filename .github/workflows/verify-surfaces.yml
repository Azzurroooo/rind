name: Verify web and desktop

on:
  pull_request:
    paths:
      - "frontend-web/**"
      - "desktop/**"
      - "runtime/**"
      - ".github/workflows/verify-surfaces.yml"
  push:
    branches: [main]
    paths:
      - "frontend-web/**"
      - "desktop/**"
      - "runtime/**"
      - ".github/workflows/verify-surfaces.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surfaces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surfaces:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend-web/package-lock.json
            desktop/package-lock.json
      - name: Build TypeScript Runtime
        run: |
          npm --prefix runtime install
          npm --prefix runtime run build
      - name: Install Web dependencies
        run: npm --prefix frontend-web ci
      - name: Install Desktop dependencies
        run: npm --prefix desktop ci
      - name: Test Web
        run: npm --prefix frontend-web test
      - name: Typecheck Desktop
        run: npm --prefix desktop run typecheck
      - name: Test Desktop and Gateway
        run: npm --prefix desktop test
      - name: Build Desktop and bundled Web
        run: npm --prefix desktop run build

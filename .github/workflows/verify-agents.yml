name: Verify agents management, runtime, and CLI

on:
  pull_request:
    paths: ["agent-management/**", "rind-runtime-client/**", "frontend-cli/**", "runtime/**", ".github/workflows/verify-agents.yml"]
  push:
    branches: [main]
    paths: ["agent-management/**", "rind-runtime-client/**", "frontend-cli/**", "runtime/**", ".github/workflows/verify-agents.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            agent-management/package-lock.json
            frontend-cli/package-lock.json
      - run: npm --prefix runtime ci
      - run: npm --prefix runtime run build
      - run: npm --prefix agent-management ci
      - run: npm --prefix frontend-cli ci
      - run: npm --prefix agent-management test
      - run: npm --prefix frontend-cli test
      - name: Stage distributable CLI components
        shell: bash
        run: |
          node agent-management/stage.mjs --skip-build "$RUNNER_TEMP/rind-cli-stage"
          node "$RUNNER_TEMP/rind-cli-stage/frontend-cli/bin/rind.js" --version

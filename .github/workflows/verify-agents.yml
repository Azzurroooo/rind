name: Verify agents management, runtime, and CLI

on:
  pull_request:
    paths: ["agent-management/**", "rind-runtime-client/**", "frontend-cli/**", "runtime/**", ".github/workflows/verify-agents.yml"]
  push:
    branches: [main]
    paths: ["agent-management/**", "rind-runtime-client/**", "frontend-cli/**", "runtime/**", ".github/workflows/verify-agents.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            agent-management/package-lock.json
            frontend-cli/package-lock.json
      - run: npm --prefix runtime install
      - run: npm --prefix runtime run build
      - run: npm --prefix agent-management ci
      - run: npm --prefix frontend-cli ci
      - run: npm --prefix runtime test
      - run: npm --prefix agent-management test
      - run: npm --prefix frontend-cli test
      - name: Stage distributable CLI components
        shell: bash
        run: node agent-management/stage.mjs "$RUNNER_TEMP/rind-cli-stage"
